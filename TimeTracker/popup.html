<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 280px;
      padding: 15px;
      margin: 0;
      background: #fdfdfd;
    }
    h3 { margin-top: 0; color: #333; text-align: center;}
    #pie-chart {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 15px auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      background: conic-gradient(#ccc 0% 100%);
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 13px;
    }
    .color-box {
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border-radius: 2px;
    }
    .site-name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;}
    .site-time { font-weight: bold; color: #555; }
  </style>
</head>
<body>
  <h3>Time Usage</h3>
  <div id="pie-chart"></div>
  <div id="legend"></div>
  <script src="popup.js"></script>
</body>
</html>
